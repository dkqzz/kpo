<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ВышBuild API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <nav><a href="{{ url_for('dashboard') }}">ВышBuild</a> · <a href="{{ url_for('openapi') }}">OpenAPI JSON</a></nav>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    if (window.SwaggerUIBundle) {
      window.SwaggerUIBundle({ url: {{ url_for('openapi') | tojson }}, dom_id: '#swagger-ui', validatorUrl: null });
    } else {
      document.querySelector('#swagger-ui').textContent = 'Swagger UI не загрузился. Схема API доступна по ссылке OpenAPI JSON.';
    }
  </script>
</body>
</html>
